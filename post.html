<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記事 - MediumArchive4furuhashilab</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<p><a href="index.html">&larr; 一覧へ戻る</a></p>
<article id="post-body">読み込み中...</article>
<p class="source-link" id="source-link"></p>

<script>
const params = new URLSearchParams(location.search);
const path = params.get("path");
const body = document.getElementById("post-body");
const sourceLink = document.getElementById("source-link");

function parseFrontmatter(raw) {
  const match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!match) return { meta: {}, body: raw };
  const meta = {};
  for (const line of match[1].split("\n")) {
    const i = line.indexOf(":");
    if (i === -1) continue;
    const key = line.slice(0, i).trim();
    let value = line.slice(i + 1).trim();
    if (value.startsWith('"') && value.endsWith('"')) value = value.slice(1, -1);
    meta[key] = value;
  }
  return { meta, body: match[2] };
}

if (!path) {
  body.textContent = "記事が指定されていません。";
} else {
  fetch(path)
    .then((r) => {
      if (!r.ok) throw new Error("not found");
      return r.text();
    })
    .then((raw) => {
      const { meta, body: md } = parseFrontmatter(raw);
      body.innerHTML = marked.parse(md);
      if (meta.medium_url) {
        sourceLink.innerHTML = `原文: <a href="${meta.medium_url}">${meta.medium_url}</a>`;
      }
    })
    .catch(() => {
      body.textContent = "記事の読み込みに失敗しました。";
    });
}
</script>
</body>
</html>
