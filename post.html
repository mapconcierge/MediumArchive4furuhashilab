<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記事 - MediumArchive4furuhashilab</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<p class="nav-row">
  <a href="index.html">&larr; 一覧へ戻る</a>
  <a id="md-source-link" href="#" target="_blank" rel="noopener" hidden>Markdown Source</a>
</p>
<h1 id="post-title"></h1>
<p class="meta" id="post-meta"></p>
<article id="post-body">読み込み中...</article>
<p class="source-link" id="source-link"></p>

<script>
const GITHUB_BLOB_BASE = "https://github.com/mapconcierge/MediumArchive4furuhashilab/blob/main/";

const params = new URLSearchParams(location.search);
const path = params.get("path");
const titleEl = document.getElementById("post-title");
const metaEl = document.getElementById("post-meta");
const body = document.getElementById("post-body");
const sourceLink = document.getElementById("source-link");
const mdSourceLink = document.getElementById("md-source-link");

function stripFrontmatter(raw) {
  const match = raw.match(/^---\n[\s\S]*?\n---\n?([\s\S]*)$/);
  return match ? match[1] : raw;
}

// Markdown files reference images/links relative to their own directory
// (e.g. "../../assets/images/..."), but this page lives at the site root,
// so the browser would otherwise resolve them relative to post.html instead
// of the post's own folder. Resolve every img/a href against the post's
// directory after rendering.
function resolveRelativeUrls(container, postPath) {
  const postDir = new URL(postPath.slice(0, postPath.lastIndexOf("/") + 1), location.href);
  container.querySelectorAll("img[src], a[href]").forEach((el) => {
    const attr = el.tagName === "IMG" ? "src" : "href";
    const value = el.getAttribute(attr);
    if (!value || /^([a-z]+:)?\/\//i.test(value) || value.startsWith("#")) return;
    el.setAttribute(attr, new URL(value, postDir).href);
  });
}

function renderMeta(post) {
  metaEl.innerHTML = "";

  function addSeparator() {
    if (metaEl.childNodes.length) metaEl.appendChild(document.createTextNode(" ・ "));
  }

  const date = post.published_at ? post.published_at.slice(0, 10) : "";
  if (date) metaEl.appendChild(document.createTextNode(date));

  if (post.author) {
    addSeparator();
    if (post.author_username) {
      const authorLink = document.createElement("a");
      authorLink.href = `https://medium.com/@${post.author_username}`;
      authorLink.target = "_blank";
      authorLink.rel = "noopener";
      authorLink.textContent = post.author;
      metaEl.appendChild(authorLink);
    } else {
      metaEl.appendChild(document.createTextNode(post.author));
    }
  }

  if (post.tags && post.tags.length) {
    addSeparator();
    post.tags.forEach((tag, i) => {
      if (i > 0) metaEl.appendChild(document.createTextNode(", "));
      const tagLink = document.createElement("a");
      tagLink.href = `https://medium.com/furuhashilab/all?topic=${encodeURIComponent(tag)}`;
      tagLink.target = "_blank";
      tagLink.rel = "noopener";
      tagLink.textContent = tag;
      metaEl.appendChild(tagLink);
    });
  }
}

if (!path) {
  body.textContent = "記事が指定されていません。";
} else {
  mdSourceLink.href = GITHUB_BLOB_BASE + path.split("/").map(encodeURIComponent).join("/");
  mdSourceLink.hidden = false;

  Promise.all([
    fetch("data/index.json").then((r) => (r.ok ? r.json() : { posts: [] })),
    fetch(path).then((r) => {
      if (!r.ok) throw new Error("not found");
      return r.text();
    }),
  ])
    .then(([index, raw]) => {
      const post = index.posts.find((p) => p.path === path) || {};

      titleEl.textContent = post.title || path;
      document.title = post.title ? `${post.title} - MediumArchive4furuhashilab` : "記事 - MediumArchive4furuhashilab";
      renderMeta(post);

      body.innerHTML = marked.parse(stripFrontmatter(raw));
      resolveRelativeUrls(body, path);

      if (post.medium_url) {
        sourceLink.innerHTML = `原文: <a href="${post.medium_url}">${post.medium_url}</a>`;
      }
    })
    .catch(() => {
      body.textContent = "記事の読み込みに失敗しました。";
    });
}
</script>
</body>
</html>
