<main>
<ul id="post-list"></ul>
</main>

<script>
fetch("data/index.json")
  .then((r) => r.json())
  .then((data) => {
    const list = document.getElementById("post-list");
    if (!data.posts.length) {
      list.innerHTML = "<li>まだアーカイブされた記事がありません。</li>";
      return;
    }
    for (const post of data.posts) {
      const li = document.createElement("li");

      const a = document.createElement("a");
      a.href = `post.html?path=${encodeURIComponent(post.path)}`;
      a.textContent = post.title;
      li.appendChild(a);

      const meta = document.createElement("span");
      meta.className = "meta";

      function addSeparator() {
        if (meta.childNodes.length) meta.appendChild(document.createTextNode(" ・ "));
      }

      const date = post.published_at ? post.published_at.slice(0, 10) : "";
      if (date) meta.appendChild(document.createTextNode(date));

      if (post.author) {
        addSeparator();
        if (post.author_username) {
          const authorLink = document.createElement("a");
          authorLink.href = `https://medium.com/@${post.author_username}`;
          authorLink.target = "_blank";
          authorLink.rel = "noopener";
          authorLink.textContent = post.author;
          meta.appendChild(authorLink);
        } else {
          meta.appendChild(document.createTextNode(post.author));
        }
      }

      if (post.tags.length) {
        addSeparator();
        post.tags.forEach((tag, i) => {
          if (i > 0) meta.appendChild(document.createTextNode(", "));
          const tagLink = document.createElement("a");
          tagLink.href = `https://medium.com/furuhashilab/all?topic=${encodeURIComponent(tag)}`;
          tagLink.target = "_blank";
          tagLink.rel = "noopener";
          tagLink.textContent = tag;
          meta.appendChild(tagLink);
        });
      }

      li.appendChild(meta);

      list.appendChild(li);
    }
  })
  .catch(() => {
    document.getElementById("post-list").innerHTML =
      "<li>記事一覧の読み込みに失敗しました。</li>";
  });
</script>
